server {
  listen 80;
  server_name _;

  # ── Security Headers ──────────────────────────────────────
  server_tokens off;                                    # Hide nginx version
  add_header X-Content-Type-Options  "nosniff" always;  # Prevent MIME-sniffing
  add_header X-Frame-Options         "DENY" always;     # Prevent clickjacking
  add_header X-XSS-Protection        "1; mode=block" always;
  add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;

  # Serve static React build
  root /usr/share/nginx/html;
  index index.html index.htm;

  # Proxy API requests to backend service
  location /api/ {
    proxy_pass http://backend:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback: serve index.html for client-side routes
  location / {
    try_files $uri /index.html;
  }
}
