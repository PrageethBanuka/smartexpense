name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:

env:
  DOCKERHUB_USER: banukarajapaksha

jobs:
  # ──────────────────────────────────────────────
  # SECURITY: Scan for leaked secrets in git history
  # ──────────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history needed to scan all commits
      - name: Run Gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # SAST: Static Application Security Testing
  # ──────────────────────────────────────────────
  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep (OWASP Top 10)
        uses: semgrep/semgrep-action@v1
        with:
          config: "p/owasp-top-ten"
        env:
          SEMGREP_APP_TOKEN: ""   # Works without token for public rules

  # ──────────────────────────────────────────────
  # IaC SECURITY: Scan Terraform for misconfigurations
  # ──────────────────────────────────────────────
  terraform-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tfsec (Terraform security scanner)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true   # Warn initially, make it gating later

  # Test backend code (with coverage)
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Run tests with coverage
        run: npx jest --forceExit --detectOpenHandles --coverage
      - name: Check for known vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true   # Warn now, make it gating once clean

  # Test frontend code
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      - name: Build
        run: npm run build
        env:
          CI: false

  # Build, scan, and push backend Docker image
  backend-dockerhub:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build locally first (don't push yet)
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          load: true       # Load into local Docker (not push)
          tags: ${{ env.DOCKERHUB_USER }}/smartexpense-backend:latest

      # Scan for vulnerabilities BEFORE pushing
      - name: Scan backend image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_USER }}/smartexpense-backend:latest
          format: 'table'
          exit-code: '1'              # Fail if vulnerabilities found
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true        # Only flag fixable issues

      # Push only if scan passed
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and push backend image
        run: |
          docker tag ${{ env.DOCKERHUB_USER }}/smartexpense-backend:latest \
                     ${{ env.DOCKERHUB_USER }}/smartexpense-backend:sha-${{ github.sha }}
          docker push ${{ env.DOCKERHUB_USER }}/smartexpense-backend:latest
          docker push ${{ env.DOCKERHUB_USER }}/smartexpense-backend:sha-${{ github.sha }}

  # Build, scan, and push frontend Docker image
  frontend-dockerhub:
    runs-on: ubuntu-latest
    needs: [test-frontend, backend-dockerhub]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build locally first
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          load: true
          tags: ${{ env.DOCKERHUB_USER }}/smartexpense-frontend:latest
          build-args: |
            REACT_APP_API_URL=/api

      # Scan for vulnerabilities BEFORE pushing
      - name: Scan frontend image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_USER }}/smartexpense-frontend:latest
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # Push only if scan passed
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and push frontend image
        run: |
          docker tag ${{ env.DOCKERHUB_USER }}/smartexpense-frontend:latest \
                     ${{ env.DOCKERHUB_USER }}/smartexpense-frontend:sha-${{ github.sha }}
          docker push ${{ env.DOCKERHUB_USER }}/smartexpense-frontend:latest
          docker push ${{ env.DOCKERHUB_USER }}/smartexpense-frontend:sha-${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [backend-dockerhub, frontend-dockerhub]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      
      - name: Copy docker-compose to EC2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # Create directory and copy docker-compose file
          ssh -i ~/.ssh/deploy_key ubuntu@$EC2_HOST "sudo mkdir -p /opt/smartexpense && sudo chown ubuntu:ubuntu /opt/smartexpense"
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml ubuntu@$EC2_HOST:/opt/smartexpense/
      
      - name: Configure EC2 with Ansible (if needed)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "🔧 Checking if Ansible configuration is needed..."
          
          # Check if Docker and Docker Compose are installed
          if ssh -i ~/.ssh/deploy_key ubuntu@$EC2_HOST "docker --version && docker-compose --version" 2>/dev/null; then
            echo "✅ Docker and Docker Compose already installed, skipping Ansible"
          else
            echo "⚙️  Running Ansible playbook to install Docker..."
            
            # Install Ansible
            pip3 install ansible
            
            # Create temporary inventory
            echo "[app_servers]" > /tmp/inventory.ini
            echo "$EC2_HOST ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/deploy_key ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> /tmp/inventory.ini
            
            # Run Ansible playbook (only Docker installation tasks)
            ansible-playbook -i /tmp/inventory.ini ansible/playbook.yml --tags docker || echo "⚠️  Ansible completed with warnings (may be normal)"
            
            echo "✅ Ansible configuration complete"
          fi
      
      - name: Deploy containers
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@$EC2_HOST "cd /opt/smartexpense && docker-compose -f docker-compose.prod.yml pull && docker-compose -f docker-compose.prod.yml up -d --force-recreate && docker image prune -f"
      
      - name: Wait for services to stabilize
        run: |
          echo "⏳ Waiting 30 seconds for containers to start..."
          sleep 30
          
      - name: Health check - Verify all services
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "🔍 Running comprehensive health checks..."
          echo ""
          
          # Check container status first
          echo "📦 Checking container status..."
          ssh -i ~/.ssh/deploy_key ubuntu@$EC2_HOST "cd /opt/smartexpense && docker-compose -f docker-compose.prod.yml ps"
          echo ""
          
          # Check if frontend container is running
          FRONTEND_STATUS=$(ssh -i ~/.ssh/deploy_key ubuntu@$EC2_HOST "cd /opt/smartexpense && docker-compose -f docker-compose.prod.yml ps frontend | grep -c 'Up' || echo '0'")
          if [ "$FRONTEND_STATUS" = "0" ]; then
            echo "❌ Frontend container is not running!"
            echo "📋 Frontend logs:"
            ssh -i ~/.ssh/deploy_key ubuntu@$EC2_HOST "cd /opt/smartexpense && docker-compose -f docker-compose.prod.yml logs --tail=50 frontend"
            exit 1
          fi
          
          # Check Frontend HTTP with retries
          echo "🌐 Checking Frontend (http://$EC2_HOST:8080)..."
          MAX_RETRIES=5
          RETRY_DELAY=10
          
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://$EC2_HOST:8080 || echo "000")
            echo "  Attempt $i/$MAX_RETRIES: HTTP $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "304" ]; then
              echo "✅ Frontend is responding (HTTP $HTTP_CODE)"
              break
            elif [ $i -eq $MAX_RETRIES ]; then
              echo "❌ Frontend health check failed after $MAX_RETRIES attempts"
              echo "📋 Frontend logs:"
              ssh -i ~/.ssh/deploy_key ubuntu@$EC2_HOST "cd /opt/smartexpense && docker-compose -f docker-compose.prod.yml logs --tail=50 frontend"
              echo "📋 Backend logs:"
              ssh -i ~/.ssh/deploy_key ubuntu@$EC2_HOST "cd /opt/smartexpense && docker-compose -f docker-compose.prod.yml logs --tail=30 backend"
              exit 1
            else
              echo "  Waiting ${RETRY_DELAY}s before retry..."
              sleep $RETRY_DELAY
            fi
          done
          
          echo ""
          echo "🎉 Deployment successful!"
          echo "📍 Application URL: http://$EC2_HOST:8080"
