name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:

env:
  DOCKERHUB_USER: banukarajapaksha

jobs:
  # Test backend code
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci || npm install
      - run: node -e "console.log('backend deps ok')"

  # Test frontend code
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      - name: Build
        run: npm run build
        env:
          CI: false

  # Build and push backend Docker image
  backend-dockerhub:
    runs-on: ubuntu-latest
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/smartexpense-backend:latest
            ${{ env.DOCKERHUB_USER }}/smartexpense-backend:sha-${{ github.sha }}

  # Build and push frontend Docker image
  frontend-dockerhub:
    runs-on: ubuntu-latest
    needs: [test-frontend, backend-dockerhub]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push frontend image to Docker Hub (prod)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/smartexpense-frontend:latest
            ${{ env.DOCKERHUB_USER }}/smartexpense-frontend:sha-${{ github.sha }}
          build-args: |
            REACT_APP_API_URL=/api

  deploy:
    runs-on: ubuntu-latest
    needs: [backend-dockerhub, frontend-dockerhub]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      
      - name: Copy docker-compose to EC2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # Create directory and copy docker-compose file
          ssh -i ~/.ssh/deploy_key ubuntu@$EC2_HOST "sudo mkdir -p /opt/smartexpense && sudo chown ubuntu:ubuntu /opt/smartexpense"
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml ubuntu@$EC2_HOST:/opt/smartexpense/
      
      - name: Deploy containers
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@$EC2_HOST "cd /opt/smartexpense && docker-compose -f docker-compose.prod.yml pull && docker-compose -f docker-compose.prod.yml up -d --force-recreate && docker image prune -f"
          
      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Application deployed to: http://$EC2_HOST:8080"
          sleep 10
          curl -f http://$EC2_HOST:8080 || echo "Health check - verify manually"