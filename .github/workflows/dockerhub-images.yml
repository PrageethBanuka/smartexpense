name: Build Docker Images (Docker Hub)

on:
  push:
    branches: [ main, master ]
  pull_request:

env:
  DOCKERHUB_USER: banukarajapaksha

jobs:
  backend-dockerhub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/smartexpense-backend:latest
            ${{ env.DOCKERHUB_USER }}/smartexpense-backend:sha-${{ github.sha }}

  frontend-dockerhub:
    runs-on: ubuntu-latest
    needs: backend-dockerhub
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push frontend image to Docker Hub (prod)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/smartexpense-frontend:latest
            ${{ env.DOCKERHUB_USER }}/smartexpense-frontend:sha-${{ github.sha }}
          build-args: |
            REACT_APP_API_URL=/api

  deploy:
    runs-on: ubuntu-latest
    needs: [backend-dockerhub, frontend-dockerhub]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to EC2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ubuntu
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # Deploy via SSH
          ssh -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST << 'ENDSSH'
            set -e
            cd /opt/smartexpense
            
          # Use printf to preserve newlines in the key
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # Verify key format
          head -1 ~/.ssh/deploy_key | grep -q "BEGIN.*PRIVATE KEY" || (echo "Invalid key format" && exit 1)
          
          # Deploy via SSH
          ssh -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST /bin/bash << 'ENDSSH'
            set -e
            
            # Create app directory if it doesn't exist
            sudo mkdir -p /opt/smartexpense
            sudo chown ubuntu:ubuntu /opt/smartexpense
            cd /opt/smartexpense
            
            # Copy docker-compose file if it doesn't exist
            if [ ! -f docker-compose.prod.yml ]; then
              echo "Creating docker-compose.prod.yml..."
              cat > docker-compose.prod.yml <<'COMPOSE'
version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartexpense
      POSTGRES_USER: smartexpense
      POSTGRES_PASSWORD: smartexpense
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartexpense -d smartexpense"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: banukarajapaksha/smartexpense-backend:latest
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smartexpense
      DB_USER: smartexpense
      DB_PASSWORD: smartexpense
      JWT_SECRET: change-me-in-prod
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '4000:4000'
    restart: unless-stopped

  frontend:
    image: banukarajapaksha/smartexpense-frontend:latest
    ports:
      - '8080:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
COMPOSE
            fi
            
            # Pull latest images
            docker-compose -f docker-compose.prod.yml pull
            
            # Restart containers with new images
            docker-compose -f docker-compose.prod.yml up -d --force-recreate
            
            # Clean up old images
            docker image prune -f
            
            echo "Deployment complete!"
ENDSSH
          
      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Application deployed to: http://$EC2_HOST:8080"
          sleep 10
          curl -f http://$EC2_HOST:8080 || echo "Health check - verify manually"