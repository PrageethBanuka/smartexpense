name: Deploy to Production

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual deployment

env:
  DOCKERHUB_USER: banukarajapaksha

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []  # Will run after docker images are built in dockerhub-images.yml
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to EC2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ubuntu
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # Deploy via SSH
          ssh -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST << 'ENDSSH'
            set -e
            cd /opt/smartexpense
            
            # Pull latest images
            docker-compose -f docker-compose.prod.yml pull
            
            # Restart containers with new images
            docker-compose -f docker-compose.prod.yml up -d --force-recreate
            
            # Clean up old images
            docker image prune -f
            
            echo "Deployment complete!"
          ENDSSH
          
      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Application should be available at: http://$EC2_HOST:8080"
          sleep 10
          curl -f http://$EC2_HOST:8080 || echo "Frontend health check failed"
