name: Build Docker Images (Docker Hub)

on:
  push:
    branches: [ main, master ]
  pull_request:

env:
  DOCKERHUB_USER: banukarajapaksha

jobs:
  backend-dockerhub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/smartexpense-backend:latest
            ${{ env.DOCKERHUB_USER }}/smartexpense-backend:sha-${{ github.sha }}

  frontend-dockerhub:
    runs-on: ubuntu-latest
    needs: backend-dockerhub
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push frontend image to Docker Hub (prod)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/smartexpense-frontend:latest
            ${{ env.DOCKERHUB_USER }}/smartexpense-frontend:sha-${{ github.sha }}
          build-args: |
            REACT_APP_API_URL=/api
