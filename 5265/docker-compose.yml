version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: smartexpense-postgres
    environment:
      POSTGRES_DB: smartexpense
      POSTGRES_USER: smartexpense
      POSTGRES_PASSWORD: smartexpense
    # Map to 5433 on host to avoid clashing with a local Postgres on 5432
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartexpense -d smartexpense"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: smartexpense-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smartexpense
      DB_USER: smartexpense
      DB_PASSWORD: smartexpense
      JWT_SECRET: dev-secret-change
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '4000:4000'

  frontend:
    build: ./frontend
    container_name: smartexpense-frontend
    environment:
      REACT_APP_API_URL: http://localhost:4000/api
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  pgdata:
