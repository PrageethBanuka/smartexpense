version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartexpense
      POSTGRES_USER: smartexpense
      POSTGRES_PASSWORD: smartexpense
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartexpense -d smartexpense"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: banukarajapaksha/smartexpense-backend:latest
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smartexpense
      DB_USER: smartexpense
      DB_PASSWORD: smartexpense
      JWT_SECRET: change-me-in-prod
      CORS_ORIGIN: http://44.215.84.51:8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '4000:4000'

  frontend:
    image: banukarajapaksha/smartexpense-frontend:latest
    ports:
      - '8080:80'
    depends_on:
      - backend
      

volumes:
  pgdata:
