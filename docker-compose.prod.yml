# ─────────────────────────────────────────────────────────────
# SmartExpense — Production Docker Compose
# ─────────────────────────────────────────────────────────────
# SECURITY: All secrets read from .env file.
# Run: cp .env.example .env && nano .env   (fill in values)
# ─────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-smartexpense}
      POSTGRES_USER: ${DB_USER:-smartexpense}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartexpense -d smartexpense"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: banukarajapaksha/smartexpense-backend:latest
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smartexpense}
      DB_USER: ${DB_USER:-smartexpense}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '4000:4000'
    restart: unless-stopped

  frontend:
    image: banukarajapaksha/smartexpense-frontend:latest
    ports:
      - '8080:80'
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
