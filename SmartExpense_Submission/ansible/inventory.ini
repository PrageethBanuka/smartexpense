# Ansible Inventory File
# Define your servers here

[app_servers]
production ansible_host=YOUR_SERVER_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[app_servers:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# Example with multiple environments:
# [staging]
# staging ansible_host=STAGING_IP ansible_user=ubuntu

# [production]
# production ansible_host=PRODUCTION_IP ansible_user=ubuntu
