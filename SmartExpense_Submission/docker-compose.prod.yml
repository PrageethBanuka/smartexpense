version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartexpense
      POSTGRES_USER: smartexpense
      POSTGRES_PASSWORD: smartexpense
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartexpense -d smartexpense"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smartexpense
      DB_USER: smartexpense
      DB_PASSWORD: smartexpense
      JWT_SECRET: change-me-in-prod
      CORS_ORIGIN: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '4000'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        REACT_APP_API_URL: /api
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  pgdata:
